[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nostalgiabox"
version = "1.1.0"
description = "TV: a retro television player for Linux, macOS, and Raspberry Pi, with a channel guide and native settings."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "nostalgiabox/assets/fonts/OFL.txt"]
authors = [{ name = "NostalgiaBox" }]
keywords = ["raspberry-pi", "media-player", "retro-tv", "mpv", "nostalgia", "kids"]

# Core runtime dependency. The hardware-specific dependencies (python-mpv,
# evdev) live in the optional "pi" extra so the pure logic can be developed and
# tested on any machine.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6,<7"]
packaging = ["build>=1", "pyinstaller>=6"]
# Everything needed to actually run on the Raspberry Pi against a TV.
pi = [
    "python-mpv>=1.0.5",
    "evdev>=1.6.1; sys_platform == 'linux'",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
nostalgiabox = "nostalgiabox.__main__:main"

[tool.setuptools.packages.find]
include = ["nostalgiabox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
nostalgiabox = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/*.md"]
