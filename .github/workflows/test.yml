name: Desktop compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install mpv on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Install mpv on macOS
        if: runner.os == 'macOS'
        run: brew install mpv
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Build wheel and check bundled font
        run: |
          python -m pip wheel --no-deps . -w dist
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/nostalgiabox*.whl')[0]); assert 'nostalgiabox/assets/fonts/VT323-Regular.ttf' in z.namelist()"
