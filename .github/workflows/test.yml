name: Desktop compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install mpv on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv libegl1 libopengl0
      - name: Install mpv on macOS
        if: runner.os == 'macOS'
        run: brew install mpv
      - run: python -m pip install -e '.[dev,desktop]' build
      - run: python -m pytest -q
      - name: Build distributions and check bundled font
        run: |
          python -m build
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/nostalgiabox*.whl')[0]); assert 'nostalgiabox/assets/fonts/VT323-Regular.ttf' in z.namelist()"
      - uses: actions/upload-artifact@v4
        with:
          name: TV-${{ runner.os }}-python-${{ matrix.python }}
          path: dist/*
  desktop-bundle:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install '.[desktop,packaging]'
      - run: bash scripts/build-desktop.sh
      - name: Smoke test packaged launcher
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            dist/TV.app/Contents/MacOS/TV --version
          else
            dist/TV/TV --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TV-desktop-${{ runner.os }}-unsigned
          path: |
            dist/TV-macOS-unsigned.zip
            dist/TV-linux-unsigned.tar.gz
